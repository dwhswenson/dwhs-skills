[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "authored-pr-queue"
version = "0.1.0"
description = "Build snapshots of actionable open GitHub pull requests authored by a user"
requires-python = ">=3.11"
dependencies = [
  "PyGithub>=2.8,<3",
]

[project.scripts]
authored-pr-queue = "authored_pr_queue.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
