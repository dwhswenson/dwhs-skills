[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "progress-collector"
version = "0.1.0"
description = "Collect normalized personal progress data from GitHub, Linear, and Google Calendar"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.0,<3",
  "google-auth>=2.0,<3",
  "google-auth-oauthlib>=1.2,<2",
  "platformdirs>=4,<5",
  "PyGithub>=2.8,<3",
]

[project.scripts]
collect-progress = "progress_collector.cli:main"
collect-progress-auth = "progress_collector.auth_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
