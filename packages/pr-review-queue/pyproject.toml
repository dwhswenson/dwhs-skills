[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-queue"
version = "0.1.0"
description = "AWS Lambda and Codex skill client for pending GitHub PR reviews"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "PyGithub>=2.8,<3",
]

[project.scripts]
pr-review-queue = "pr_review_queue.local_runner:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64"]

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.pypi-dependencies]
pr_review_queue = { path = ".", editable = true }

[tool.pixi.tasks]
fetch-review-queue = "python -m pr_review_queue.client"
run-local-review-queue = "python -m pr_review_queue.local_runner"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
