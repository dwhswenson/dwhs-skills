name: pr-review-queue CI

on:
  pull_request:
    paths:
      - "packages/pr-review-queue/**"
      - ".github/workflows/pr-review-queue-ci.yaml"
  push:
    paths:
      - "packages/pr-review-queue/**"
      - ".github/workflows/pr-review-queue-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/pr-review-queue/pyproject.toml

      - name: Install package
        run: python -m pip install -e './packages/pr-review-queue[dev]'

      - name: Run tests
        run: python -m pytest packages/pr-review-queue/tests
